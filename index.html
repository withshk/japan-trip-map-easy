<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #fbfaf8; --fg: #1d1b19; --muted: #77716b; --line: #e8e4df; --card: #ffffff;
    --accent: #c2410c; --radius: 12px;
    --d1: #e0662f; --d2: #d4a017; --d3: #c0392b; --d4: #2f855a; --d5: #3b6fb6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", system-ui, sans-serif; }
  .app { display: grid; grid-template-columns: 380px minmax(0, 1fr); overflow: hidden; height: 100vh; height: 100dvh; }
  aside { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); background: var(--bg); min-height: 0; }
  header { padding: 20px 20px 12px; }
  header h1 { margin: 0; font-size: 19px; letter-spacing: -0.02em; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 20px 12px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 999px;
    padding: 6px 12px; font: inherit; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
  .tab.on { color: #fff; border-color: transparent; background: var(--c, var(--fg)); }
  .daysum { padding: 0 20px 12px; display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; }
  .daysum b { font-size: 16px; letter-spacing: -0.01em; }
  .daysum span { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .list { flex: 1; overflow-y: auto; padding: 4px 12px 24px; min-height: 0; }
  .stop { display: grid; grid-template-columns: 44px 40px 1fr; gap: 10px; align-items: center; padding: 8px; border-radius: 10px; cursor: pointer; }
  .stop:hover { background: #f1eee9; }
  .stop.sel { background: #f1eee9; box-shadow: inset 3px 0 0 var(--c); }
  .stop .t { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
  .stop .th { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: #ece8e2; display: grid; place-items: center; font-size: 11px; color: var(--muted); }
  .stop .nm { font-weight: 600; font-size: 14px; line-height: 1.3; }
  .stop .nt { font-size: 12px; color: var(--muted); line-height: 1.35; }
  .leg { display: grid; grid-template-columns: 44px 40px 1fr; gap: 10px; padding: 0 8px; }
  .leg .bar { justify-self: center; width: 2px; min-height: 22px; background: var(--c); opacity: .35; }
  .leg.train .bar { background: repeating-linear-gradient(var(--c) 0 4px, transparent 4px 7px); opacity: .55; }
  .leg.taxi .bar { background: repeating-linear-gradient(var(--c) 0 2px, transparent 2px 5px); opacity: .55; }
  .leg .lt { font-size: 11.5px; color: var(--muted); align-self: center; padding: 2px 0; }
  .vias { margin-top: 3px; display: flex; flex-wrap: wrap; align-items: center; gap: 3px; }
  .via { font-size: 11px; padding: 1px 6px; border-radius: 5px; background: #fff; border: 1px solid var(--line); color: var(--fg); cursor: pointer; }
  .via:hover { border-color: var(--c); }
  .arr { color: var(--muted); font-size: 11px; }
  .stop.future, .leg.future { opacity: .4; }
  .stop.future:hover { opacity: .8; }
  .reset { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; color: var(--fg); }
  .note { margin: 8px 8px 0; padding: 10px 12px; border-radius: 10px; background: #f4f1ec; font-size: 12px; color: var(--muted); }
  #map { height: 100%; width: 100%; background: #eef0f2; }
  #map .leaflet-tile-pane { filter: saturate(.7); }
  #map.low .pin .lb { display: none; }
  #map.low .pin.hotel .lb, #map.low .pin.sel .lb, #map.low .pin:hover .lb { display: inline; }
  main { position: relative; min-height: 0; }
  .legend { position: absolute; left: 12px; bottom: 12px; z-index: 500; background: rgba(255,255,255,.92); border-radius: 10px; padding: 7px 10px;
    font-size: 11px; color: var(--muted); display: flex; gap: 12px; align-items: center; }
  .legend i { display: inline-block; width: 18px; height: 0; border-top: 2.5px solid #777; vertical-align: middle; margin-right: 4px; }
  .legend i.d { border-top-style: dashed; } .legend i.o { border-top-style: dotted; }

  /* markers */
  .pin { display: flex; align-items: center; gap: 5px; transform: translate(-16px, -16px); white-space: nowrap; pointer-events: auto; }
  .pin .ph { position: relative; width: 32px; height: 32px; border-radius: 50%; border: 2.5px solid var(--c); background: #fff center/cover no-repeat; box-shadow: 0 1px 4px rgba(0,0,0,.25); flex: none; }
  .pin .no { position: absolute; right: -6px; top: -6px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--c); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; line-height: 1; }
  .pin .lb { background: rgba(255,255,255,.94); border-radius: 6px; padding: 1px 6px; font-size: 11.5px; font-weight: 600; color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .pin.dot .ph { width: 14px; height: 14px; border-width: 3px; background: #fff; margin: 9px; }
  .pin.dot .no { display: none; }
  .pin.dot .lb { font-weight: 500; color: var(--muted); }
  .pin.hotel .ph { border-radius: 8px; }
  .pin.sta { transform: translate(-7px, -7px); gap: 3px; }
  .pin.sta .ph { width: 10px; height: 10px; border-width: 2.5px; background: #fff; box-shadow: none; margin: 2px; }
  .pin.sta .no { display: none; }
  .pin.sta .lb { font-size: 10.5px; font-weight: 500; color: var(--muted); background: rgba(255,255,255,.85); padding: 0 4px; box-shadow: none; }
  #map.mid .pin.sta .lb { display: none; }
  #map.mid .pin.sta:hover .lb, #map.mid .pin.sta.sel .lb { display: inline; }
  .pin.sel .ph { transform: scale(1.25); box-shadow: 0 0 0 4px rgba(255,255,255,.9), 0 2px 8px rgba(0,0,0,.35); }
  .pin.dim { opacity: .35; }
  .leaflet-div-icon { background: none; border: 0; }

  /* detail */
  .detail { position: absolute; top: 12px; right: 12px; z-index: 600; width: 340px; max-height: calc(100% - 24px); overflow-y: auto;
    background: var(--card); border-radius: 14px; box-shadow: 0 6px 30px rgba(0,0,0,.18); display: none; }
  .detail.open { display: block; animation: pop .22s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .detail img { width: 100%; aspect-ratio: 3/2; object-fit: cover; display: block; border-radius: 14px 14px 0 0; }
  .detail .bd { padding: 14px 16px 16px; }
  .detail .x { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 16px; cursor: pointer; line-height: 30px; }
  .detail h2 { margin: 0; font-size: 18px; letter-spacing: -0.02em; }
  .detail .jp { color: var(--muted); font-size: 12.5px; margin-left: 6px; font-weight: 400; }
  .detail .when { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 10px; }
  .detail .when span { font-size: 11.5px; padding: 2px 8px; border-radius: 6px; background: #f4f1ec; color: var(--fg); font-variant-numeric: tabular-nums; }
  .detail p { margin: 0 0 10px; font-size: 13.5px; }
  .detail ul { margin: 0 0 12px; padding-left: 18px; font-size: 13px; }
  .detail li { margin: 2px 0; }
  .detail .kv { display: grid; grid-template-columns: 84px 1fr; gap: 4px 10px; font-size: 12.5px; margin-bottom: 12px; }
  .detail .kv div:nth-child(odd) { color: var(--muted); }
  .detail a.btn { display: inline-block; font-size: 12.5px; text-decoration: none; color: #fff; background: var(--fg); padding: 7px 12px; border-radius: 8px; margin-right: 6px; }
  .detail a.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }

  @media (max-width: 760px) {
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 48vh 1fr; grid-template-rows: 48dvh 1fr; }
    main { order: 1; } aside { order: 2; border-right: 0; border-top: 1px solid var(--line); }
    header { padding: 12px 16px 6px; } header h1 { font-size: 16px; }
    .tabs { padding: 4px 16px 8px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; } .tabs::-webkit-scrollbar { display: none; } .daysum { padding: 0 16px 8px; }
    .detail { position: fixed; top: auto; bottom: 0; left: 0; right: 0; width: auto; max-height: 72vh; border-radius: 16px 16px 0 0; }
    .detail img { border-radius: 16px 16px 0 0; aspect-ratio: 16/9; }
    .legend { display: none; }
  }
</style>
</head>

const same = (a,b) => a[0]===b[0] && a[1]===b[1];

function pinHtml(key, nums, color, dim){
  const p = P[key];
  const cls = ['pin', p.type==='dot'?'dot':'', p.type==='station'?'sta':'', p.type==='hotel'?'hotel':'', dim?'dim':'', selKey===key?'sel':''].join(' ');
  const bg = p.img ? `background-image:url('${p.img}')` : '';
  return `<div class="${cls}" style="--c:${color}"><div class="ph" style="${bg}">${nums?`<span class="no">${nums}</span>`:''}</div><span class="lb">${p.name}</span></div>`;
}

// i번째 목적지로 가는 구간을 [시작, 끝, 이동수단] 조각으로 나눔
function legSegs(d, i){
  const s = d.stops[i], a = P[d.stops[i-1].p].ll, b = P[s.p].ll;
  let out;
  if (s.v && s.v.length){
    const vs = s.v.map(k=>P[k].ll);
    out = [{a, b:vs[0], m:'walk'}];
    for (let j=1;j<vs.length;j++) out.push({a:vs[j-1], b:vs[j], m:'train'});
    out.push({a:vs[vs.length-1], b, m:'walk'});
  } else out = [{a, b, m:s.m}];
  return out.filter(g=>!same(g.a,g.b));
}
function lineStyle(m, color, thin){
  return { color, weight: thin?2.5:4, opacity: thin?.55:.85, dashArray: m==='train' ? '8 7' : m==='taxi' ? '2 6' : null, lineCap:'round' };
}
function drawLeg(d, i, thin){
  const color = css(d.c);
  legSegs(d,i).forEach(g=>L.polyline([g.a,g.b], lineStyle(g.m, color, thin)).addTo(routeLayer));
}
function drawDay(d, upto, thin){
  const last = upto==null ? d.stops.length-1 : upto;
  for (let i=1;i<=last;i++) drawLeg(d, i, thin);
}

function show(i){
  animTok++; cur = i; selKey = null; prog = null; closeDetail();
  [...tabs.children].forEach((b,j)=>b.classList.toggle('on', i===j));
  routeLayer.clearLayers(); layer.clearLayers(); markers = {};
  const sum = document.getElementById('daysum'), list = document.getElementById('list');
  let bounds = [];
  if (i===0){
    DAYS.forEach(d=>drawDay(d, null, true));
    const seen = new Set();
    DAYS.forEach(d=>d.stops.forEach(s=>{ if(seen.has(s.p)) return; seen.add(s.p); addMarker(s.p, '', P[s.p].type==='hotel'?'#1d1b19':css(d.c)); bounds.push(P[s.p].ll); }));
    sum.innerHTML = `<b>4박 5일 전체 동선</b><span>날짜를 누르면 그날 경로만 보여줌</span>`;
    list.innerHTML = DAYS.map((d,k)=>`<div class="stop" data-day="${k+1}" style="--c:${d.c}"><div class="t">${d.d}<br>${d.w}</div><div class="th" style="background:${d.c};color:#fff;font-weight:700">${k+1}</div><div><div class="nm">${d.title}</div><div class="nt">${d.stops.filter(s=>!P[s.p].type).map(s=>P[s.p].name).join(' · ')||'공항 이동'}</div></div></div>`).join('')
      + `<div class="note">걸음 수는 1km에 1,400보 정도로 잡은 대충 계산. 하루 2만보 안 넘게 짰음. 날짜별 화면에서 갈아타는 역까지 보임.</div>`;
    list.querySelectorAll('.stop').forEach(el=>el.onclick=()=>show(+el.dataset.day));
  } else {
    const d = DAYS[i-1], color = css(d.c);
    drawDay(d, null);
    const nums = {};
    d.stops.forEach((s,k)=>{ (nums[s.p] = nums[s.p]||[]).push(k+1); });
    const staSet = new Set(); d.stops.forEach(s=>(s.v||[]).forEach(k=>{ if(!nums[k]) staSet.add(k); }));
    staSet.forEach(k=>addMarker(k, '', color));
    Object.keys(nums).forEach(key=>addMarker(key, nums[key].join('·'), P[key].type==='hotel'?'#1d1b19':color));
    const keys = Object.keys(nums);
    const spotsLL = keys.filter(k=>!P[k].type).map(k=>P[k].ll);
    if (spotsLL.length) {
      const sb = L.latLngBounds(spotsLL).pad(0.6);
      bounds = keys.concat([...staSet]).map(k=>P[k].ll).filter(ll=>sb.contains(ll));
    } else bounds = keys.map(k=>P[k].ll);
    renderSum();
    let h = '';
    d.stops.forEach((s,k)=>{
      const p = P[s.p];
      if (k>0) {
        const via = (s.v||[]).map(v=>`<span class="via" data-key="${v}">${P[v].name}</span>`).join('<span class="arr">›</span>');
        h += `<div class="leg ${s.m}" data-idx="${k}" style="--c:${d.c}"><div></div><div class="bar"></div><div class="lt">${s.l||''}${via?`<div class="vias">${via}</div>`:''}</div></div>`;
      }
      h += `<div class="stop" data-idx="${k}" data-key="${s.p}" style="--c:${d.c}"><div class="t">${s.t}</div>${p.img?`<img class="th" src="${p.img}" alt="">`:`<div class="th">${p.type==='dot'?'역':''}</div>`}<div><div class="nm">${p.name}</div><div class="nt">${s.n}</div></div></div>`;
    });
    h += `<div class="note">${d.note}</div>`;
    list.innerHTML = h;
    list.querySelectorAll('.stop').forEach(el=>el.onclick=()=>goStop(+el.dataset.idx));
    list.querySelectorAll('.via').forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); select(el.dataset.key, true); });
  }
  list.scrollTop = 0;
  if (bounds.length) map.fitBounds(L.latLngBounds(bounds).pad(0.12), { maxZoom: 15 }); setTimeout(zcls, 50);
}

function renderSum(){
  const d = DAYS[cur-1];
  document.getElementById('daysum').innerHTML = `<b>${d.title}</b><span>${d.d} (${d.w}) · ${d.steps}</span>` +
    (prog!=null ? `<button class="reset" id="reset">전체 경로 보기</button>` : `<span>목적지를 누르면 거기까지만, 다음 목적지를 누르면 이어서 그려줌</span>`);
  const r = document.getElementById('reset'); if (r) r.onclick = ()=>show(cur);
}

function addMarker(key, nums, color){
  const m = L.marker(P[key].ll, { icon: L.divIcon({ html: pinHtml(key, nums, color), className:'', iconSize:[0,0] }), riseOnHover:true, zIndexOffset: P[key].type==='station'? -500 : 0 });
  m.on('click', (e)=>{ L.DomEvent.stopPropagation(e); markerClick(key); });
  m._meta = { key, nums, color, dim:false };
  m.addTo(layer); markers[key] = m;
}
function markerClick(key){
  if (cur===0 || P[key].type==='station') return select(key, false);
  const d = DAYS[cur-1];
  const idxs = d.stops.map((s,k)=>s.p===key?k:-1).filter(k=>k>=0);
  const next = idxs.find(k=>prog!=null && k>prog);
  goStop(next!=null ? next : idxs[0]);
}

function refreshPins(){
  Object.values(markers).forEach(m=>{ const {key,nums,color,dim} = m._meta; m.setIcon(L.divIcon({ html: pinHtml(key, nums, color, dim), className:'', iconSize:[0,0] })); m.setZIndexOffset(key===selKey?1000:(P[key].type==='station'?-500:0)); });
}

// 지금까지 그린 지점(prog) 기준으로 지도 핀/목록 흐리게
function updateProgressUI(){
  const d = DAYS[cur-1];
  const reached = new Set();
  d.stops.forEach((s,k)=>{ if (prog==null || k<=prog){ reached.add(s.p); if (k>0) (s.v||[]).forEach(v=>reached.add(v)); } });
  Object.values(markers).forEach(m=>{ m._meta.dim = !reached.has(m._meta.key); });
  refreshPins();
  document.querySelectorAll('#list [data-idx]').forEach(el=>el.classList.toggle('future', prog!=null && +el.dataset.idx > prog));
  renderSum();
}

async function goStop(k){
  if (cur===0) return;
  const d = DAYS[cur-1], tok = ++animTok;
  const key = d.stops[k].p;
  markListSel(k);
  if (prog==null || k<=prog || k===0){
    // 이전 구간까지만 정적으로 그리기
    prog = k; routeLayer.clearLayers(); drawDay(d, k); updateProgressUI();
    select(key, true);
    return;
  }
  // 다음 목적지: 선을 그리면서 지도가 따라감
  closeDetail(true);
  const from = prog;
  for (let i=from+1; i<=k; i++){
    const ok = await animateLeg(d, i, tok);
    if (!ok || tok!==animTok) return;
    prog = i; updateProgressUI(); markListSel(i);
  }
  if (tok!==animTok) return;
  select(key, true);
}

function markListSel(k){
  document.querySelectorAll('.stop[data-idx]').forEach(el=>el.classList.toggle('sel', +el.dataset.idx===k));
  const li = document.querySelector(`.stop[data-idx="${k}"]`); if (li) li.scrollIntoView({ block:'nearest', behavior:'smooth' });
}

async function animateLeg(d, i, tok){
  const segs = legSegs(d, i), color = css(d.c);
  if (!segs.length) return true;
  const pts = segs.flatMap(g=>[g.a,g.b]);
  const z = Math.max(11, Math.min(15, map.getBoundsZoom(L.latLngBounds(pts).pad(0.25)) + 1));
  map.flyTo(segs[0].a, z, { duration: .6 }); await wait(650);
  for (const g of segs){
    if (tok!==animTok) return false;
    await animSeg(g, color, tok);
  }
  return tok===animTok;
}
function animSeg(g, color, tok){
  return new Promise(res=>{
    const dist = map.distance(g.a, g.b);
    const dur = Math.max(450, Math.min(2200, dist / (g.m==='walk' ? 1.1 : 10)));
    const line = L.polyline([g.a, g.a], lineStyle(g.m, color)).addTo(routeLayer);
    const t0 = performance.now();
    const step = t=>{
      if (tok!==animTok){ res(); return; }
      const r = Math.min(1, (t-t0)/dur), e = r<.5 ? 2*r*r : 1-Math.pow(-2*r+2,2)/2;
      const p = [g.a[0]+(g.b[0]-g.a[0])*e, g.a[1]+(g.b[1]-g.a[1])*e];
      line.setLatLngs([g.a, p]);
      map.panTo(p, { animate:false });
      if (r<1) requestAnimationFrame(step); else res();
    };
    requestAnimationFrame(step);
  });
}

function select(key, fly){
  selKey = key; refreshPins();
  if (P[key].type!=='station' && cur===0) document.querySelectorAll('.stop[data-key]').forEach(el=>el.classList.toggle('sel', el.dataset.key===key));
  const p = P[key];
  const visits = [];
  DAYS.forEach((d,k)=>d.stops.forEach(s=>{
    if (!(cur===0 || cur===k+1)) return;
    if (s.p===key) visits.push(`${d.d} ${s.t} · ${s.n}`);
    else if ((s.v||[]).includes(key)) visits.push(`${d.d} ${P[s.p].name} 가는 길`);
  }));
  const g = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.jp.split(' · ')[0] || p.name)}`;
  const el = document.getElementById('detail');
  if (p.type==='station') {
    el.innerHTML = `<button class="x" aria-label="닫기" style="background:rgba(0,0,0,.35)">×</button><div class="bd"><h2>${p.name}<span class="jp">${p.jp}</span></h2><div class="when"><span>${p.line}</span>${visits.map(v=>`<span>${v}</span>`).join('')}</div><a class="btn" href="${g}" target="_blank" rel="noopener">구글 지도</a></div>`;
  } else {
  el.innerHTML = `${p.img?`<img src="${p.img}" alt="">`:''}<button class="x" aria-label="닫기">×</button>
    <div class="bd"><h2>${p.name}<span class="jp">${p.jp}</span></h2>
    <div class="when">${p.leaf?'<span style="background:#fde8e4;color:#b42318">단풍 명소</span>':''}${visits.map(v=>`<span>${v}</span>`).join('')}</div>
    <p>${p.desc}</p>
    ${p.kv?`<div class="kv">${p.kv.map(([a,b])=>`<div>${a}</div><div>${b}</div>`).join('')}</div>`:''}
    ${p.tips&&p.tips.length?`<ul>${p.tips.map(t=>`<li>${t}</li>`).join('')}</ul>`:''}
    <a class="btn" href="${g}" target="_blank" rel="noopener">구글 지도</a>${p.link?`<a class="btn ghost" href="${p.link}" target="_blank" rel="noopener">${key==='koko'?'부킹닷컴':'공식 사이트'}</a>`:''}</div>`;
  if (!p.img) el.querySelector('.x').style.background = 'rgba(0,0,0,.35)';
  }
  el.classList.add('open'); el.scrollTop = 0;
  el.querySelector('.x').onclick = ()=>closeDetail();
  if (fly) map.flyTo(p.ll, Math.max(map.getZoom(), 14), { duration: .6 });
}
function closeDetail(keepSel){
  document.getElementById('detail').classList.remove('open');
  if (selKey){ selKey = null; refreshPins(); }
  if (!keepSel && cur===0) document.querySelectorAll('.stop.sel').forEach(e=>e.classList.remove('sel'));
}
map.on('click', ()=>closeDetail());
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDetail(); });

show(0);
</script>
</body>
</html>
